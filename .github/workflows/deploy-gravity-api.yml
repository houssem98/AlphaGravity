name: Deploy Gravity API to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'services/gravity-api/**'
      - '.github/workflows/deploy-gravity-api.yml'
  workflow_dispatch:

jobs:
  gate:
    name: Import + syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gravity-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m compileall -q app/

      - name: Ruff (errors only)
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 app/

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy gravity-api
        run: |
          cd services/gravity-api
          flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
