name: Deploy Market UI to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'apps/market-ui/**'
      - 'api/**'
      - 'vercel.json'
      - '.github/workflows/deploy-market-ui.yml'
  workflow_dispatch:

jobs:
  gate:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm -w market-ui run typecheck

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vercel/action@main
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          production: true
