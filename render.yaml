# render.yaml — Render deploy for Gravity API + Market Server.
#
# This is an ALTERNATIVE to Fly, not a replacement. `services/gravity-api/fly.toml`
# stays valid and untouched: when the Fly invoice is paid, going back is one
# `fly deploy` with no code change and nothing here to undo. Both providers build
# the SAME Dockerfile, so the running image is identical either way.
#
# Read docs/DEPLOY_PORTABILITY.md before deploying. FOUR secrets below MUST be
# copied from Fly rather than generated, or data becomes unreadable and live
# credentials stop working. The env list is reconciled against the real
# `fly secrets list` inventory, not inferred from the code.
services:
  # ── Gravity API (FastAPI) ─────────────────────────────────────────────
  - type: web
    name: gravity-api
    runtime: docker
    # Same Dockerfile Fly builds. A `runtime: python` + buildCommand setup would
    # be a SECOND build definition that silently drifts from the container Fly
    # ships; one Dockerfile means one artifact.
    dockerfilePath: services/gravity-api/Dockerfile
    dockerContext: services/gravity-api
    # Fly runs primary_region = "iad" (us-east). `virginia` is the matching
    # Render region — Supabase and the SEC endpoints are both east-coast, and
    # `oregon` put every DB round trip across the country.
    region: virginia
    # Fly gives this 4096 MB with an explicit note that 2 GB OOMs on large
    # 10-K/10-Q parsing. Render `starter` is 512 MB and will OOM on any ingest;
    # `standard` (2 GB) is the floor for query serving, `pro` (4 GB) matches Fly.
    plan: standard
    healthCheckPath: /health
    # Requires the repo connected to Render, which needs a git push (escalation).
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      # ── Secrets that MUST be copied from Fly, never generated ──────────
      # `generateValue: true` mints a NEW random value on first deploy. For
      # these two that is data loss, not a fresh start:
      #   KEY_ENCRYPTION_KEY_V1 decrypts the envelope-encrypted API key store —
      #     a new KEK makes every stored key permanently undecryptable.
      #   AUTH_JWT_SECRET signs issued tokens — a new secret logs out every
      #     existing session and breaks tokens Fly already handed out.
      # Copy both from `fly secrets list` / the Fly dashboard before deploying.
      - key: KEY_ENCRYPTION_KEY_V1
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      # AUTH_TOKEN_SECRET and SUPABASE_JWT_SECRET are the same hazard class:
      # AUTH_TOKEN_SECRET signs the non-JWT auth tokens, and SUPABASE_JWT_SECRET
      # validates the Supabase-issued JWTs the search WebSocket authenticates
      # with. Regenerating either rejects credentials that are currently valid.
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # ── Data plane ────────────────────────────────────────────────────
      # The corpus lives in Supabase (chunks + financials + pgvector), NOT in a
      # provider-managed Postgres. A Render-provisioned database would come up
      # empty and the API would serve nothing while looking healthy — which is
      # why no `databases:` block exists in this file.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # NOT set on Fly today — prod runs with no REDIS_URL, so anything that
      # would use it is already running on whatever fallback the code chooses.
      # Setting it on Render would make the two deploys behave differently.
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false

      # ── LLM + retrieval providers ─────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY_SECONDARY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      # Set on Fly as a separate name with an identical value to GOOGLE_API_KEY.
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false

      # ── Transactional email (password reset, verification) ────────────
      # All five are set on Fly. Without them those flows fail at send time,
      # after the user has already been told the mail is on its way.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Base URL used to build links in those emails — must be the RENDER
      # hostname while Render is serving, or reset links point back at Fly.
      - key: APP_URL
        sync: false

      # ── Integrations ──────────────────────────────────────────────────
      - key: TAVILY_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      # Not set on Fly today. Listed so enabling one is a dashboard edit rather
      # than a config change; unset behaves exactly as it does on Fly.
      - key: OPENAI_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: PAGEINDEX_API_KEY
        sync: false
      # SEC requires a descriptive User-Agent; the code defaults to one, this
      # only overrides it.
      - key: SEC_USER_AGENT
        sync: false

      # ── Feature gates ─────────────────────────────────────────────────
      - key: TREE_NAV_ENABLED
        value: "true"
      - key: HEADROOM_ENABLED
        value: "false"

      # ── CORS — set to the deployed market-ui origin ───────────────────
      - key: CORS_ORIGINS
        sync: false

      # ── Observability ─────────────────────────────────────────────────
      - key: SENTRY_DSN
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false

  # ── Market Server (Express proxy) ─────────────────────────────────────
  - type: web
    name: market-server
    runtime: docker
    dockerfilePath: services/market-server/Dockerfile
    dockerContext: services/market-server
    region: virginia
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: GRAVITY_API_URL
        fromService:
          name: gravity-api
          type: web
          property: hostport
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

# No `databases:` and no managed Redis on purpose. Both would provision empty
# stores next to the real ones (Supabase, Upstash), cost money, and give the API
# a healthy-looking path to an empty corpus. Every data dependency here is
# external and shared with Fly, which is what makes switching back free.
